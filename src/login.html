<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main aria-labelledby="login-title">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-title">E-commerce login</h1>
        <p class="intro">Log in to your account to continue shopping.</p>

        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username"
                required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                placeholder="Enter your password" required>

            <a class="forgot-password" href="#status" id="forgot-password">Forgot password?</a>

            <div class="actions">
                <button type="submit">Login</button>
                <button type="button" class="secondary" id="sign-up">Sign up</button>
            </div>
        </form>
        <p id="status" role="status"></p>
    </main>
    <script type="module" src="login.js"></script>
</body>

</html>
